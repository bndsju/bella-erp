version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bella-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bella
      POSTGRES_USER: bella
      POSTGRES_PASSWORD: bella
    ports:
      - "5432:5432"
    volumes:
      - bella_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bella"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: bella-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bella
      DB_USER: bella
      DB_PASSWORD: bella
    ports:
      - "8080:8080"

volumes:
  bella_pg_data:
