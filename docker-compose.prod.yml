# Producao. Passo a passo em docs/deploy.md.
#   cp .env.exemplo .env   (preencha) e depois:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Somente as portas 80 e 443 (Caddy) ficam abertas para a internet; banco e API so conversam dentro da rede do Docker.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bella
      POSTGRES_USER: bella
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    volumes:
      - bella_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bella -d bella"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_NAME: bella
      DB_USER: bella
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO com 32+ caracteres}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA}
      CORS_ALLOWED_ORIGINS: https://${SITE_ADDRESS:?defina SITE_ADDRESS}
      # A maquina e pequena: deixa o Java usar so metade da memoria, o resto fica para o banco e o sistema
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50

  site:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?defina SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  bella_pg_data:
  caddy_data:
  caddy_config:
