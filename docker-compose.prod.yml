# Producao: use com um arquivo .env (nunca versionado) com DB_PASSWORD, JWT_SEGREDO, ADMIN_SENHA e CORS_ALLOWED_ORIGINS.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# O banco nao publica porta. O backend so escuta em 127.0.0.1 (o proxy HTTPS, na fase 3, fica na frente).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bella
      POSTGRES_USER: bella
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    volumes:
      - bella_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bella -d bella"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_NAME: bella
      DB_USER: bella
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      JWT_SEGREDO: ${JWT_SEGREDO:?defina JWT_SEGREDO com 32+ caracteres}
      ADMIN_SENHA: ${ADMIN_SENHA:?defina ADMIN_SENHA}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?defina CORS_ALLOWED_ORIGINS}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  bella_pg_data:
