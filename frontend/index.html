<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bella</title>
    <script>
      // Aplica o tema salvo antes de a tela aparecer, para não piscar o claro no Dark.
      (function () {
        try {
          var salvo = localStorage.getItem("bella-tema");
          var escuro =
            salvo === "dark" ||
            (salvo !== "claro" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) document.documentElement.setAttribute("data-tema", "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
