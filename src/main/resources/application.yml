spring:
  application:
    name: bella-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bella}
    username: ${DB_USER:bella}
    password: ${DB_PASSWORD:bella}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.bella: DEBUG

bella:
  seguranca:
    habilitada: true
    # Defina JWT_SEGREDO (32+ caracteres) para os logins sobreviverem a reinicios; sem ele, um segredo temporario e usado.
    jwt-segredo: ${JWT_SEGREDO:}
    jwt-validade-horas: ${JWT_VALIDADE_HORAS:8}
    # Primeiro acesso (so e criado se nao houver nenhum usuario). Sem ADMIN_SENHA, a senha e gerada e escrita no log.
    admin-login: ${ADMIN_LOGIN:admin}
    admin-nome: ${ADMIN_NOME:Administrador}
    admin-senha: ${ADMIN_SENHA:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
