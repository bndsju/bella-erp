# Perfil de producao (SPRING_PROFILES_ACTIVE=prod). Sem valores padrao para segredos:
# se faltar DB_PASSWORD, JWT_SEGREDO ou CORS_ALLOWED_ORIGINS, a aplicacao nao sobe.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  # Atras do proxy (Caddy): usa X-Forwarded-* para enderecos e esquema corretos
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

logging:
  level:
    root: INFO
    com.bella: INFO

bella:
  seguranca:
    jwt-segredo: ${JWT_SEGREDO}
    admin-senha: ${ADMIN_SENHA}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
