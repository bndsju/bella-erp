name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bella_test
          POSTGRES_USER: bella
          POSTGRES_PASSWORD: bella
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bella"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar projeto
        run: mvn -B clean compile

      - name: Rodar testes
        run: mvn -B test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: bella_test
          DB_USER: bella
          DB_PASSWORD: bella

      - name: Empacotar aplicação
        run: mvn -B package -DskipTests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Auditoria de dependências (produção)
        run: npm audit --omit=dev --audit-level=high

  segredos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Procurar segredos vazados
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Revisar dependências novas
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
